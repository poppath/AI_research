name: Knowledge checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-structural-and-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repo.py
      - run: python scripts/validate_ai_readiness.py
      - run: python scripts/build_legacy_catalog.py --check
      - run: python scripts/build_numeric_candidates.py --check
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
